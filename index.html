<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fairness Report Survey</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--surface:#F4F7F8;--text:#1F497D;--primary:#00B5B5;--error:#C0392B;--warn:#C07D0A;
      --muted:#5B6B7B;--muted-2:#7D8B99;--fg:31,73,125;--primary-rgb:0,181,181;--error-rgb:192,57,43}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--text);font:14px/1.55 'DM Sans',sans-serif;padding:22px 16px 80px}
.wrap{max-width:820px;margin:0 auto}
.card{background:var(--bg);border:1px solid rgba(var(--fg),.08);border-radius:10px;padding:24px 28px;margin-bottom:18px}
h1{font-size:22px;margin:0 0 8px} h2{font-size:16px;margin:0 0 10px} h3{font-size:13px;margin:24px 0 8px}
.mono{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-2)}
.sub{color:var(--muted);font-size:13px;line-height:1.6}
.step{display:flex;gap:6px;margin-bottom:16px}
.step span{flex:1;height:6px;border-radius:3px;background:rgba(var(--fg),.1)} .step span.on{background:var(--primary)}
.step span.can{cursor:pointer} .step span.can:hover{outline:2px solid var(--primary);outline-offset:2px}
label.q{display:block;font-weight:600;margin:18px 0 6px}
select,input[type=text],textarea{width:100%;font:inherit;color:var(--text);background:#fff;border:1px solid rgba(var(--fg),.2);border-radius:6px;padding:8px 10px}
textarea{min-height:70px;resize:vertical}
button{font:inherit;font-weight:600;background:var(--primary);color:#0E2F52;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
button.ghost{background:transparent;color:var(--text);border:1px solid rgba(var(--fg),.2)}
button:disabled{opacity:.45;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;margin-top:22px}
table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:8px 10px;border-bottom:1px solid rgba(var(--fg),.07)}
th{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);font-weight:500}
.audit{table-layout:fixed} .audit th:not(:first-child),.audit td:not(:first-child){width:120px;text-align:center;vertical-align:middle}
.pass{color:#1E8449;font-weight:600} .fail{color:var(--error);font-weight:600}
.pill{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;padding:2px 8px;border-radius:3px;background:rgba(var(--primary-rgb),.12);color:var(--primary)}
.pill.f{background:rgba(var(--error-rgb),.12);color:var(--error)}
.report{background:var(--surface);border-left:3px solid var(--primary);border-radius:0 8px 8px 0;padding:16px 20px;margin:12px 0;font-size:13.5px;line-height:1.65}
.report p{margin:0 0 10px} .report p:last-child{margin-bottom:0} .report b{color:var(--text)}
/* rankable sentence cards */
.rank{border:1px solid rgba(var(--fg),.12);border-radius:8px;padding:11px 13px 11px 48px;margin:10px 0 4px;line-height:1.5;position:relative;cursor:pointer;background:#fff;transition:border-color .15s}
.rank:hover{border-color:var(--primary)} .rank.done{border-color:var(--primary);background:rgba(var(--primary-rgb),.05)}
.rank .n{position:absolute;left:12px;top:10px;width:26px;height:26px;border-radius:50%;border:2px solid rgba(var(--fg),.2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted-2)}
.rank.done .n{background:var(--primary);border-color:var(--primary);color:#0E2F52}
.rank .lab{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);display:block;margin-bottom:2px}
/* wording radios */
.opt{display:block;border:1px solid rgba(var(--fg),.12);border-radius:8px;padding:10px 13px;margin:6px 0;cursor:pointer;background:#fff;line-height:1.5}
.opt:has(input:checked){border-color:var(--primary);background:rgba(var(--primary-rgb),.05)}
.opt input{margin-right:8px}
.opt .k{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted-2);margin-left:6px}
.opt .frame{font-style:italic;color:var(--muted-2);margin-right:2px}
.err{color:var(--error);font-size:12px;margin-top:8px;display:none}
/* results */
.res h3{margin-top:26px} .res .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.res .box{background:var(--surface);border-radius:8px;padding:12px 14px;font-size:13px}
.res ol{margin:4px 0 0 18px;padding:0} .res .box .mono{margin-bottom:6px;display:block}
.same{color:#1E8449} .diff{color:var(--warn)}
pre{white-space:pre-wrap;font:11px/1.5 'DM Mono',monospace;background:#fff;border:1px solid rgba(var(--fg),.1);border-radius:6px;padding:10px;max-height:240px;overflow:auto}
@media print{body{background:#fff;padding:0} .nav,button{display:none}}
</style>
</head>
<body><div class="wrap" id="app"></div>

ors (missed cases).", "conclusion": "Not recommended for use across Sex groups without mitigation. The priority is the uneven error mix affecting Male patients."}, "tpr": {"Female": 0.9, "Male": 0.7}, "fpr": {"Female": 0.1, "Male": 0.1}, "counts": {"Male": {"n": 1000, "pos": 300, "tp": 210, "fn": 90, "fp": 70}, "Female": {"n": 1000, "pos": 300, "tp": 270, "fn": 30, "fp": 70}}}, "case3": {"metrics": [{"key": "equalOpportunity", "label": "Equal Opportunity", "value": 0.0, "threshold": "Pass \u2264 0.10 (TPR gap)", "pass": true, "text": "Among patients whose Diagnosis is Type 1 diabetes, the model catches both groups at the same rate (85%). There is no gap (limit 10%).", "conclusion": "True cases are caught fairly across groups."}, {"key": "predictiveEquality", "label": "Predictive Equality", "value": 0.12, "threshold": "Pass \u2264 0.10 (FPR gap)", "pass": false, "text": "Among patients whose Diagnosis is not Type 1 diabetes, false alarms hit Male patients 18% of the time vs Female patients 6%, a gap of 12% (limit 10%). Unnecessary follow-up falls mostly on Male patients.", "conclusion": "False alarms, concentrated on Male patients."}, {"key": "treatmentEquality", "label": "Treatment Equality", "value": 0.3333, "threshold": "Pass \u2265 0.80 (FN/FP mix ratio)", "pass": false, "text": "Female patients' errors run 1.07 missed cases per false alarm. Male patients' run 0.36. Mix similarity is 0.33 (pass above 0.80). The more dangerous errors (missed cases) concentrate in the Female group.", "conclusion": "Female patients bear the more dangerous errors (missed cases)."}, {"key": "calibrationError", "label": "Calibration Error", "value": 0.03, "threshold": "Pass \u2264 0.10", "pass": true, "text": "Predicted risk scores are off by up to 3% in the worst group (Male), against a limit of 10%. Reliability measure, not part of the fairness score.", "conclusion": "Risk scores are consistent across groups."}], "overall": {"scorePct": 54, "risk": "Moderate Bias", "text": "2 of 3 fairness metrics failed. Our weighted fairness score reads 54% fair (Moderate Bias). The main concern is an uneven mix of error types: female patients bear the more dangerous errors (missed cases).", "conclusion": "Not recommended for use across Sex groups without mitigation. The priority is the uneven error mix affecting Female patients."}, "tpr": {"Male": 0.85, "Female": 0.85}, "fpr": {"Male": 0.18, "Female": 0.06}, "counts": {"Male": {"n": 1000, "pos": 300, "tp": 255, "fn": 45, "fp": 126}, "Female": {"n": 1000, "pos": 300, "tp": 255, "fn": 45, "fp": 42}}}, "case4": {"metrics": [{"key": "equalOpportunity", "label": "Equal Opportunity", "value": 0.0, "threshold": "Pass \u2264 0.10 (TPR gap)", "pass": true, "text": "Among patients whose Diagnosis is Type 1 diabetes, the model catches both groups at the same rate (85%). There is no gap (limit 10%).", "conclusion": "True cases are caught fairly across groups."}, {"key": "predictiveEquality", "label": "Predictive Equality", "value": 0.12, "threshold": "Pass \u2264 0.10 (FPR gap)", "pass": false, "text": "Among patients whose Diagnosis is not Type 1 diabetes, false alarms hit Female patients 18% of the time vs Male patients 6%, a gap of 12% (limit 10%). Unnecessary follow-up falls mostly on Female patients.", "conclusion": "False alarms, concentrated on Female patients."}, {"key": "treatmentEquality", "label": "Treatment Equality", "value": 0.3333, "threshold": "Pass \u2265 0.80 (FN/FP mix ratio)", "pass": false, "text": "Male patients' errors run 1.07 missed cases per false alarm. Female patients' run 0.36. Mix similarity is 0.33 (pass above 0.80). The more dangerous errors (missed cases) concentrate in the Male group.", "conclusion": "Male patients bear the more dangerous errors (missed cases)."}, {"key": "calibrationError", "label": "Calibration Error", "value": 0.03, "threshold": "Pass \u2264 0.10", "pass": true, "text": "Predicted risk scores are off by up to 3% in the worst group (Female), against a limit of 10%. Reliability measure, not part of the fairness score.", "conclusion": "Risk scores are consistent across groups."}], "overall": {"scorePct": 54, "risk": "Moderate Bias", "text": "2 of 3 fairness metrics failed. Our weighted fairness score reads 54% fair (Moderate Bias). The main concern is an uneven mix of error types: male patients bear the more dangerous errors (missed cases).", "conclusion": "Not recommended for use across Sex groups without mitigation. The priority is the uneven error mix affecting Male patients."}, "tpr": {"Female": 0.85, "Male": 0.85}, "fpr": {"Female": 0.18, "Male": 0.06}, "counts": {"Male": {"n": 1000, "pos": 300, "tp": 255, "fn": 45, "fp": 42}, "Female": {"n": 1000, "pos": 300, "tp": 255, "fn": 45, "fp": 126}}}, "case5": {"metrics": [{"key": "equalOpportunity", "label": "Equal Opportunity", "value": 0.0, "threshold": "Pass \u2264 0.10 (TPR gap)", "pass": true, "text": "Among patients whose Diagnosis is Type 1 diabetes, the model catches both groups at the same rate (85%). There is no gap (limit 10%).", "conclusion": "True cases are caught fairly across groups."}, {"key": "predictiveEquality", "label": "Predictive Equality", "value": 0.0, "threshold": "Pass \u2264 0.10 (FPR gap)", "pass": true, "text": "Among patients whose Diagnosis is not Type 1 diabetes, false alarms hit both groups at the same rate (8%). There is no gap (limit 10%).", "conclusion": "False alarms are raised fairly across groups."}, {"key": "treatmentEquality", "label": "Treatment Equality", "value": 1.0, "threshold": "Pass \u2265 0.80 (FN/FP mix ratio)", "pass": true, "text": "Both groups carry the same error mix, 0.80 missed cases per false alarm. Mix similarity is 1.00 (pass above 0.80).", "conclusion": "The error mix is balanced across groups."}, {"key": "calibrationError", "label": "Calibration Error", "value": 0.03, "threshold": "Pass \u2264 0.10", "pass": true, "text": "Predicted risk scores are off by up to 3% in the worst group (Male), against a limit of 10%. Reliability measure, not part of the fairness score.", "conclusion": "Risk scores are consistent across groups."}], "overall": {"scorePct": 100, "risk": "Highly Fair", "text": "0 of 3 fairness metrics failed. Our weighted fairness score reads 100% fair (Highly Fair). No meaningful disparity across Sex detected.", "conclusion": "This audit found no fairness barrier to using the model across Sex groups. Re-audit when the data or model changes."}, "tpr": {"Male": 0.85, "Female": 0.85}, "fpr": {"Male": 0.08, "Female": 0.08}, "counts": {"Male": {"n": 1000, "pos": 300, "tp": 255, "fn": 45, "fp": 56}, "Female": {"n": 1000, "pos": 300, "tp": 255, "fn": 45, "fp": 56}}}};

// our draft guess of what each role reads first (roles.yaml). Shown only on the results page.
const EXPECT = {
  "doctor":                 ["equalOpportunity","calibrationError","predictiveEquality","treatmentEquality"],
  "nurse":                  ["predictiveEquality","equalOpportunity","treatmentEquality","calibrationError"],
  "hospital administrator": ["equalOpportunity","predictiveEquality","treatmentEquality","calibrationError"]
};
const LABEL = {equalOpportunity:"Equal Opportunity", predictiveEquality:"Predictive Equality",
               treatmentEquality:"Treatment Equality", calibrationError:"Calibration"};
// one-line definitions shown under each metric name, survey only
const DEF = {
  equalOpportunity:   "Difference in true positive rate (how often real cases are caught) between the two groups.",
  predictiveEquality: "Difference in false positive rate (how often healthy patients are wrongly flagged) between the two groups.",
  treatmentEquality:  "Whether the mix of missed cases to false alarms is the same in both groups.",
  calibrationError:   "Whether a risk score means the same thing in both groups: of patients given a 40% risk, about 40% should actually have the condition."
};
// survey-only: the product prints a fragment here, spell it out for readers
Object.values(CASES).forEach(c => c.metrics.forEach(m => {
  m.text = m.text.replace("Reliability measure, not part of the fairness score.", "NOTE: Not part of the fairness score, but a reliability measure of the model.");
}));
const ORDER = ["case1","case2","case3","case4","case5"];
const CASE_TITLE = Object.fromEntries(ORDER.map((k,i)=>[k,"Case "+(i+1)]));
const NSTEP = ORDER.length + 2;   // intro, cases, severity. The rewrite page exists but is not rendered.
// Screen 6: the case-1 finding at other strengths. Bands and labels are the real DDFA ones
// (reporting._lv_gap and the overall risk label), computed with core.build_audit.
const SEVERITY = [
  {id:"s2",  worse:88, gap:2,  band:1, label:"Highly Fair",   passes:true},
  {id:"s8",  worse:82, gap:8,  band:2, label:"Fair",          passes:true},
  {id:"s25", worse:65, gap:25, band:4, label:"Moderate Bias", passes:false, note:"same label as case 1, but a bigger gap"},
  {id:"s40", worse:50, gap:40, band:5, label:"High Bias",     passes:false},
];

// case names: hidden from participants while answering, shown on the results page.
// Open survey.html?reveal to see them on the case pages while previewing.
const CASE_NAME = {case1:"the tool misses more girls (low TPR)", case2:"the tool misses more boys (low TPR)", case3:"the tool raises more false alarms on boys (high FPR)", case4:"the tool raises more false alarms on girls (high FPR)", case5:"no bias found"};
// Where answers go on Submit. Web3Forms relays the JSON to email and its dashboard.
// Key is issued to the email address at web3forms.com. Empty key = nothing is sent.
const W3F_KEY = "e6eddf1a-1e64-45e8-9cb4-ac79f26c3107";
const W3F_URL = "https://api.web3forms.com/submit";
const REVEAL = new URLSearchParams(location.search).has("reveal");
// survey.html?debug skips the required-field checks so you can click through
const DEBUG = new URLSearchParams(location.search).has("debug");

// three plain framings of each metric, built from the case numbers. Same fact, different
// thing it is about: what happens to the patient / what staff should do / the rule and the gap.
// FACTS is the minimum a reader needs to write their own line.
function wordings(c){
  const m = Object.fromEntries(c.metrics.map(x=>[x.key,x]));
  const g = c.counts;
  const tM=Math.round(c.tpr.Male*100), tF=Math.round(c.tpr.Female*100);
  const fM=Math.round(c.fpr.Male*100), fF=Math.round(c.fpr.Female*100);
  const ce = Math.round(m.calibrationError.value*100);
  const rM=(g.Male.fn/g.Male.fp).toFixed(2), rF=(g.Female.fn/g.Female.fp).toFixed(2);
  const eq=m.equalOpportunity.pass, pe=m.predictiveEquality.pass, te=m.treatmentEquality.pass;
  // who is worse off, as plural / singular child words
  const wT = tM<tF ? ["boys","boy"] : ["girls","girl"], oT = wT[0]==="boys" ? ["girls","girl"] : ["boys","boy"];
  const wF = fM>fF ? ["boys","boy"] : ["girls","girl"], oF = wF[0]==="boys" ? ["girls","girl"] : ["boys","boy"];
  const wE = (g.Male.fn/g.Male.fp) > (g.Female.fn/g.Female.fp) ? ["boys","boy"] : ["girls","girl"], oE = wE[0]==="boys" ? ["girls","girl"] : ["boys","boy"];
  const gapT=Math.abs(tM-tF), gapF=Math.abs(fM-fF);
  const pos=g.Male.pos, neg=g.Male.n-g.Male.pos, nEach=g.Male.n;
  const fnW = wT[0]==="boys" ? g.Male.fn : g.Female.fn, fnO = wT[0]==="boys" ? g.Female.fn : g.Male.fn;
  const fpW = wF[0]==="boys" ? g.Male.fp : g.Female.fp, fpO = wF[0]==="boys" ? g.Female.fp : g.Male.fp;
  const eFnW = wE[0]==="boys" ? g.Male.fn : g.Female.fn, eFpW = wE[0]==="boys" ? g.Male.fp : g.Female.fp;
  const eFnO = wE[0]==="boys" ? g.Female.fn : g.Male.fn, eFpO = wE[0]==="boys" ? g.Female.fp : g.Male.fp;
  const missW=Math.round((100-Math.min(tM,tF))/10), missO=Math.round((100-Math.max(tM,tF))/10);
  const oneInW=Math.round(100/Math.max(fM,fF)), oneInO=Math.round(100/Math.max(1,Math.min(fM,fF)));
  return {
    equalOpportunity: {
      facts:`real cases caught, boys ${tM}%, girls ${tF}%.`,
      ...(eq
        ? {patient:`Diabetic boys and girls are equally likely to be caught`,
           action:`No extra checks are needed for either sex on a negative result`,
           accountability:`Catch rate is the same in both groups`,
           scale:`Over a year of about 2,000 children, roughly ${g.Male.fn} diabetic children of each sex are missed, the same number for boys and girls`,
           certainty:`With ${pos} diabetic children of each sex tested, we can be confident boys and girls are caught alike`}
        : {patient:`About ${missW} in 10 diabetic ${wT[0]} are sent home undiagnosed, compared with ${missO} in 10 ${oT[0]}`,
           action:`A negative result on a ${wT[1]} deserves a second look before discharge`,
           accountability:`The tool under-detects in ${wT[0]} by ${gapT} points`,
           scale:`Over a year of about 2,000 children, roughly ${fnW} diabetic ${wT[0]} are sent home undiagnosed, compared with ${fnO} ${oT[0]}`,
           certainty:`With ${pos} diabetic children of each sex tested, a ${gapT}-point gap is not chance`})},
    predictiveEquality: {
      facts:`healthy patients wrongly flagged, boys ${fM}%, girls ${fF}%.`,
      ...(pe
        ? {patient:`Healthy boys and girls are equally likely to get a false alarm`,
           action:`An alert is as trustworthy for one sex as the other`,
           accountability:`False-alarm rate is the same in both groups`,
           scale:`Over a year of about 2,000 children, roughly ${g.Male.fp} healthy children of each sex get a false alarm, the same number for boys and girls`,
           certainty:`With ${neg} healthy children of each sex tested, we can be confident false alarms are alike`}
        : {patient:`Roughly 1 in ${oneInW} healthy ${wF[0]} gets an unnecessary workup, versus 1 in ${oneInO} ${oF[0]}`,
           action:`Expect more alerts on ${wF[0]} to turn out to be nothing`,
           accountability:`False alarms run ${gapF} points higher for ${wF[0]}`,
           scale:`Over a year of about 2,000 children, roughly ${fpW} healthy ${wF[0]} go through tests they did not need, compared with ${fpO} ${oF[0]}`,
           certainty:`With ${neg} healthy children of each sex tested, a ${gapF}-point gap is not chance`})},
    treatmentEquality: {
      facts:`misses per false alarm, boys ${rM}, girls ${rF}.`,
      ...(te
        ? {patient:`When the tool is wrong, it is wrong in the same way for boys and girls`,
           action:`Neither sex needs extra caution on a negative or a positive`,
           accountability:`Both groups have the same balance of misses to false alarms`,
           scale:`Over a year, children of each sex are missed about ${g.Male.fn} times and over-flagged about ${g.Male.fp} times`,
           certainty:`With about ${nEach} children of each sex tested, we can be confident the kinds of error match`}
        : {patient:`When the tool is wrong about ${wE[0]}, it tends to miss them; when wrong about ${oE[0]}, it tends to over-flag`,
           action:`Treat a negative on a ${wE[1]} more cautiously than a positive on a ${oE[1]}`,
           accountability:`The two sexes get different kinds of error, and the difference is large`,
           scale:`Over a year, ${wE[0]} are missed ${eFnW} times and over-flagged ${eFpW} times, while ${oE[0]} are missed ${eFnO} times and over-flagged ${eFpO} times`,
           certainty:`With about ${nEach} children of each sex tested, the difference in kind of error is not chance`})},
    calibrationError: {
      facts:`risk scores are off by up to ${ce}% in the worst group.`,
      patient:`A "40% risk" means the same for a boy as for a girl`,
      action:`The risk score can be used the same way for both sexes`,
      accountability:`Risk scores are off by at most ${ce}% in either group`,
      scale:`Over a year of about 2,000 children, a risk score is off by at most ${ce} in 100 for either sex`,
      certainty:`With about ${nEach} children of each sex tested, the risk scores are reliable for both`}
  };
}


// Q1 sentences: one plain fact per metric, no consequence, no framing. Q1 asks which METRIC
// matters, so the sentence must not lean patient / action / accountability.
function plain(c){
  const m = Object.fromEntries(c.metrics.map(x=>[x.key,x]));
  const g = c.counts;
  const tM=Math.round(c.tpr.Male*100), tF=Math.round(c.tpr.Female*100);
  const fM=Math.round(c.fpr.Male*100), fF=Math.round(c.fpr.Female*100);
  const frac = p => p%10===0 ? `${p/10} in 10` : `about ${p} in 100`;
  const wT = tM<tF ? "boys" : "girls", oT = wT==="boys" ? "girls" : "boys";
  const wF = fM>fF ? "boys" : "girls", oF = wF==="boys" ? "girls" : "boys";
  const missesMore = (g.Male.fn/g.Male.fp) > (g.Female.fn/g.Female.fp) ? "boy" : "girl";
  const flagsMore = missesMore==="boy" ? "girl" : "boy";
  const pro = s => s==="boy" ? "him" : "her";
  return {
    equalOpportunity: m.equalOpportunity.pass
      ? `The tool catches diabetic boys and girls equally often, ${frac(tM)}.`
      : `The tool catches ${frac(Math.max(tM,tF))} diabetic ${oT} but only ${frac(Math.min(tM,tF))} diabetic ${wT}.`,
    predictiveEquality: m.predictiveEquality.pass
      ? `The tool flags healthy boys and girls equally often, ${frac(fM)}.`
      : `The tool flags about 1 in ${Math.round(100/Math.max(fM,fF))} healthy ${wF} but only 1 in ${Math.round(100/Math.max(1,Math.min(fM,fF)))} healthy ${oF}.`,
    treatmentEquality: m.treatmentEquality.pass
      ? `When the tool is wrong, it is wrong in the same way for boys and girls.`
      : `When the tool gets a ${missesMore} wrong, it usually misses ${pro(missesMore)}. When it gets a ${flagsMore} wrong, it usually over-flags ${pro(flagsMore)}.`,
    calibrationError: `A risk score means the same thing for a boy as for a girl.`
  };
}

// ---------- state
const S = { step: 0, role: "", roleOther: "", answers: {}, severity: {}, rewrite: "", rewriteMode: "", rewriteWhy: "" };
SEVERITY.forEach(s => S.severity[s.id] = { same: "", why: "" });
ORDER.forEach(k => S.answers[k] = { rank: [], mod: {}, wording: {}, own: {}, numbers: "", numfmt: [], next: "", missing: "" });

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);

const PAGE_NAME = i => i===0 ? "Intro" : i<=ORDER.length ? CASE_TITLE[ORDER[i-1]] : "Gap size";
function progress(){
  S.max = Math.max(S.max||0, S.step);
  return '<div class="step">'+[...Array(NSTEP).keys()].map(i=>{
    const can = DEBUG || i<=S.max;
    return '<span class="'+(i<=S.step?'on':'')+(can?' can':'')+'" data-i="'+i+'" title="'+PAGE_NAME(i)+'"></span>';
  }).join("")+'</div>';
}
function goto(i){
  S.step = i;
  if(i===0) intro(); else if(i<=ORDER.length) casePage(i-1); else severityPage();
  window.scrollTo(0,0);
}
app.addEventListener("click", e=>{ const s = e.target.closest(".step span.can"); if(s) goto(+s.dataset.i); });

// ---------- page 0: intro

}

// ---------- pages 1-3: one case each
function casePage(i){
  const key = ORDER[i], c = CASES[key], A = S.answers[key], W = wordings(c), P = plain(c);
  const g = c.counts;
  const metricsRows = c.metrics.map(m=>`<tr><td>${m.label}<div class="sub" style="font-size:12px;margin-top:4px">${DEF[m.key]}</div></td><td style="font-family:'DM Mono',monospace;font-size:12px">${m.key==="treatmentEquality"?m.value.toFixed(2):Math.round(m.value*100)+"%"}</td><td><span class="pill ${m.pass?'':'f'}">${m.pass?'pass':'fail'}</span></td></tr>`).join("");
  if(!A.order) A.order = shuffle(c.metrics.map(m=>m.key));
  const LET = "ABCD";
  const rankCards = A.order.map((k,idx)=>{
    const m = c.metrics.find(x=>x.key===k); const pos = A.rank.indexOf(k);
    return `<div class="rank ${pos>=0?'done':''}" data-k="${k}"><span class="n">${pos>=0?pos+1:''}</span><span class="lab">${LET[idx]} · ${m.label} · ${m.pass?'pass':'fail'}</span>${esc(P[k])}</div>
      <input type="text" data-mod="${k}" value="${esc((A.mod||{})[k]||'')}" placeholder="${LET[idx]}: any change you would make to this sentence? Optional." style="margin:-4px 0 10px;font-size:12.5px">`;
  }).join("");
  const wordBlocks = c.metrics.map(m=>{
    const FR = {patient:"Patient", action:"Action", accountability:"Accountability", scale:"Scale", certainty:"Certainty"};
    const picked = A.wording[m.key] || [];
    const opts = shuffle(["patient","action","accountability","scale","certainty"]).map(t=>`<label class="opt"><input type="checkbox" name="w_${m.key}" value="${t}" ${picked.includes(t)?'checked':''}><i class="frame">${FR[t]}:</i> ${esc(W[m.key][t])}</label>`).join("");
    return `<div style="margin:22px 0 0;padding-top:14px;border-top:1px solid rgba(var(--fg),.08)"><span class="mono">${m.label}</span></div>
      <div class="sub" style="font-size:12.5px;margin:4px 0 8px">These are the numbers behind this metric: ${esc(W[m.key].facts)}</div>${opts}
      <input type="text" data-own="${m.key}" value="${esc(A.own[m.key]||'')}" placeholder="Write your own version here if none of the options fits. This is optional." style="margin-top:6px;font-size:13px">`;
  }).join("");


  app.innerHTML = progress()+`
  <div class="card">
    <div class="mono" style="margin-bottom:30px">${CASE_TITLE[key]} of ${ORDER.length} · type 1 diabetes screening · pediatric ED · 2,000 patients · by sex</div>
    <h2 style="margin:4px 0 6px">What the audit found: ${CASE_NAME[key]}</h2>
    <p class="sub" style="margin:0 0 6px"><b>You do not need to study these numbers. They are here for reference. The questions below are what matter.</b></p>
    <div class="mono" style="margin:10px 0 6px">Counts</div>
    <table class="audit"><tr><th></th><th>Male</th><th>Female</th></tr>
      <tr><td>Patients</td><td>${g.Male.n}</td><td>${g.Female.n}</td></tr>
      <tr><td>Actually have type 1 diabetes</td><td>${g.Male.pos} (${Math.round(g.Male.pos/g.Male.n*100)}%)</td><td>${g.Female.pos} (${Math.round(g.Female.pos/g.Female.n*100)}%)</td></tr>
      <tr><td>Of those, caught by the tool</td><td>${g.Male.tp} (${Math.round(c.tpr.Male*100)}%)</td><td>${g.Female.tp} (${Math.round(c.tpr.Female*100)}%)</td></tr>
      <tr><td>Of those, missed</td><td>${g.Male.fn} (${Math.round(g.Male.fn/g.Male.pos*100)}%)</td><td>${g.Female.fn} (${Math.round(g.Female.fn/g.Female.pos*100)}%)</td></tr>
      <tr><td>Healthy but flagged (false alarm)</td><td>${g.Male.fp} (${Math.round(c.fpr.Male*100)}%)</td><td>${g.Female.fp} (${Math.round(c.fpr.Female*100)}%)</td></tr>
    </table>
    <div class="mono" style="margin:20px 0 6px">Metrics</div>
    <table class="audit"><tr><th>Metric</th><th>Value</th><th>Status</th></tr>${metricsRows}</table>
    <h3>Report summary and conclusion:</h3>
    <div class="report"><p><b>Summary:</b> ${esc(c.overall.text)}</p><p><b>Conclusion:</b> ${esc(c.overall.conclusion)}</p></div>
  </div>

  <div class="card">
    <h2>1. Which would you read first?</h2>
    <p class="sub">If this report landed on your desk, which of these four findings would you read first? Click it, then click the second, third and fourth in order. Clicking a numbered card clears the order so you can start again.</p>
    <div id="ranks">${rankCards}</div>
  </div>

  <div class="card">
    <h2>2. Which wording would you want?</h2>
    <p class="sub">Each metric is written five ways below. Tick the ones you would want to read, one or several. If none fit, tick the closest and write your own in the box.</p>
    <p class="sub">The italic word at the start of each option tells you what the sentence is about. It is a label for us, not part of the sentence.</p>
    ${wordBlocks}
    <label class="q" style="margin-top:24px;padding-top:14px;border-top:1px solid rgba(var(--fg),.08)">Would you want the exact numbers shown next to the sentence?</label>
    <label class="opt"><input type="radio" name="numbers" value="yes" ${A.numbers==='yes'?'checked':''}>Yes, I would want the numbers as well.</label>
    <label class="opt"><input type="radio" name="numbers" value="no" ${A.numbers==='no'?'checked':''}>No, the sentence on its own is enough.</label>
    <label class="q">How do you prefer numbers shown? Tick any.</label>
    ${[["pct","Percentages, for example 70% of girls."],["frac","Simple fractions, for example 7 in 10 girls."],["count","Raw counts, for example 210 of 300 girls."],["ratio","Comparisons, for example girls are 3 times as likely to be missed."]]
      .map(([v,t])=>`<label class="opt"><input type="checkbox" name="numfmt" value="${v}" ${(A.numfmt||[]).includes(v)?'checked':''}>${t}</label>`).join("")}
  </div>

  <div class="card">
    <h2>3. What would you do next?</h2>
    <p class="sub">After reading this report, what would you do next? One line is enough.</p>
    <textarea id="next" placeholder="e.g. ...">${esc(A.next)}</textarea>
  </div>

  <div class="card">
    <h2>4. Is anything missing?</h2>
    <p class="sub">Is there anything missing from this report that is important to you and that you would want to see? Leave it blank if not.</p>
    <textarea id="missing" placeholder="optional">${esc(A.missing)}</textarea>
    <div class="err" id="err">Please rank all four sentences, tick at least one wording for each metric, and answer the two numbers questions.</div>
    <div class="nav"><button class="ghost" id="back">Back</button><button id="next_btn">${i<ORDER.length-1?'Next case':'Next'}</button></div>
  </div>`;

  // ranking clicks
  document.querySelectorAll(".rank").forEach(el=>el.onclick=()=>{
    const k = el.dataset.k, pos = A.rank.indexOf(k);
    if(pos>=0) A.rank.splice(pos); else if(A.rank.length<4) A.rank.push(k);
    document.querySelectorAll(".rank").forEach(e=>{ const p=A.rank.indexOf(e.dataset.k); e.classList.toggle("done",p>=0); e.querySelector(".n").textContent=p>=0?p+1:""; });
  });
  document.querySelectorAll("input[type=radio]").forEach(r=>r.onchange=()=>{ if(r.name==="numbers") A.numbers=r.value; });
  document.querySelectorAll("input[name='numfmt']").forEach(x=>x.onchange=()=>{ A.numfmt = [...document.querySelectorAll("input[name='numfmt']:checked")].map(e=>e.value); });
  document.querySelectorAll("input[type=checkbox][name^='w_']").forEach(x=>x.onchange=()=>{
    const k = x.name.slice(2); A.wording[k] = [...document.querySelectorAll(`input[name='w_${k}']:checked`)].map(e=>e.value);
  });
  document.querySelectorAll("input[data-own]").forEach(x=>x.oninput=()=>{ A.own[x.dataset.own]=x.value; });
  document.querySelectorAll("input[data-mod]").forEach(x=>x.oninput=()=>{ A.mod[x.dataset.mod]=x.value; });
  document.getElementById("next").oninput = e=>A.next=e.target.value;
  document.getElementById("missing").oninput = e=>A.missing=e.target.value;

  document.getElementById("back").onclick = ()=>{ S.step = i; i===0 ? intro() : casePage(i-1); window.scrollTo(0,0); };
  document.getElementById("next_btn").onclick = ()=>{
    const ok = A.rank.length===4 && c.metrics.every(m=>(A.wording[m.key]||[]).length) && A.numbers && (A.numfmt||[]).length;
    if(!ok && !DEBUG){ document.getElementById("err").style.display="block"; return; }
    S.step = i+2; i<ORDER.length-1 ? casePage(i+1) : severityPage(); window.scrollTo(0,0);
  };
}

// ---------- page 4: one free rewrite
// ---------- page: severity, tied back to their own Q3 answer for case 1. This is the last page.

// ---------- page: results (what they said, next to our draft guess)
function results(){
  const exp = EXPECT[S.role] || null;
  const perCase = ORDER.map(k=>{
    const A = S.answers[k], c = CASES[k], W = wordings(c);
    const mine = A.rank.map((x,i)=>`<li>${LABEL[x]}${A.mod[x]?`<div class="sub" style="font-size:12px">change: ${esc(A.mod[x])}</div>`:''}</li>`).join("");
    const ours = exp ? exp.map(x=>`<li>${LABEL[x]}</li>`).join("") : "<li class='sub'>no draft for this role</li>";
    const firstSame = exp && A.rank[0]===exp[0];
    const words = c.metrics.map(m=>`<tr><td>${m.label}</td><td>${(A.wording[m.key]||[]).map(t=>`<span class="pill" style="margin:1px 2px 1px 0">${t}</span>`).join("")}</td><td class="sub">${(A.wording[m.key]||[]).map(t=>esc(W[m.key][t])).join("<br>")}${A.own[m.key]?`<div style="margin-top:4px;color:var(--text)"><b>Own words:</b> ${esc(A.own[m.key])}</div>`:''}</td></tr>`).join("")

  app.innerHTML = progress()+`
  <div class="card res">
    <div class="mono">Thank you</div>
    <h1>What you told us</h1>
    <p class="sub" id="sendstatus">Sending your answers...</p>
    <p class="sub">Here is what you told us as a <b>${esc(S.role)}${S.roleOther?` (${esc(S.roleOther)})`:''}</b>.</p>
    ${perCase}
    <h3>Does the size of the gap change what you would do?</h3>
    <div class="box"><span class="mono">For case 1 (Moderate Bias) you said</span>${esc(S.answers.case1.next)||'<span class="sub">(blank)</span>'}</div>
    <table style="margin-top:8px"><tr><th>Gap</th><th>Our label</th><th>Same action?</th><th>If not</th></tr>
    ${SEVERITY.map(s=>`<tr><td>${s.gap}%</td><td>${s.label}</td><td>${S.severity[s.id].same||'?'}</td><td class="sub">${esc(S.severity[s.id].why)}</td></tr>`).join("")}</table>
    <h3>Raw answers</h3>
    <p class="sub">This is what a backend would receive.</p>
    <pre id="raw">${esc(JSON.stringify(payload,null,1))}</pre>
    <div class="nav"><span><button id="close">Close</button> <button class="ghost" id="again" style="margin-left:8px">Start over</button></span><button class="ghost" id="dl" style="display:none">Download my answers</button></div>
  </div>`;
  document.getElementById("again").onclick = ()=>location.reload();
  // browsers only let a script close tabs it opened; fall back to a plain goodbye page
  document.getElementById("close").onclick = ()=>{ window.close(); setTimeout(()=>{ app.innerHTML = '<div class="card"><h2>Thank you</h2><p class="sub">Your answers have been sent. You can close this tab.</p></div>'; }, 150); };
  send(payload);
  document.getElementById("dl").onclick = ()=>{
    const b = new Blob([JSON.stringify(payload,null,1)],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(b);
    a.download = `survey-${S.role.replace(/\s+/g,'-')}-${Date.now()}.json`; a.click();
  };
}

// POST the answers. On failure, show the download button so nothing is lost.
async function send(payload){
  const st = document.getElementById("sendstatus"), dl = document.getElementById("dl");
  if(!W3F_KEY){ st.textContent = "Preview mode: answers were not sent."; dl.style.display = "inline-block"; return; }
  try{
    const r = await fetch(W3F_URL, {method:"POST", headers:{"Content-Type":"application/json", "Accept":"application/json"},
      body: JSON.stringify({access_key: W3F_KEY, subject: `ATET survey: ${payload.role}${payload.roleOther?' ('+payload.roleOther+')':''}`,
                            from_name: "ATET survey", role: payload.role, answers: JSON.stringify(payload)})});
    const j = await r.json();
    if(j.success){ st.textContent = "Your answers have been sent. Thank you. You can close this page."; }
    else throw new Error(j.message || "not accepted");
  }catch(e){
    st.innerHTML = "Your answers could not be sent (" + esc(e.message) + "). Please download them and email the file to shad.islam@synodintellicare.com.";
    dl.style.display = "inline-block";
  }
}
intro();
</script>
